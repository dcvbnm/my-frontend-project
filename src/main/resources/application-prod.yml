server:
  port: ${PORT:${SERVER_PORT:8081}}

spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost;instanceName=SQLEXPRESS;databaseName=ershoupingtai;encrypt=false;trustServerCertificate=true}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  thymeleaf:
    cache: true
    prefix: classpath:/templates/
    suffix: .html

jwt:
  secret: ${JWT_SECRET:change-this-secret-before-production}
  issuer: ${JWT_ISSUER:campus-trade-platform}
  expiration: ${JWT_EXPIRATION:86400000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}
  access-expire-seconds: ${JWT_ACCESS_EXPIRE_SECONDS:3600}
  refresh-expire-seconds: ${JWT_REFRESH_EXPIRE_SECONDS:604800}
  header: Authorization
  prefix: Bearer

admin:
  username: ${ADMIN_USERNAME:admin}
  password: ${ADMIN_PASSWORD:change-admin-password}

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
