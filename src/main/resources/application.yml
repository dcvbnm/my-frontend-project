spring:
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=campus_trade;encrypt=false;trustServerCertificate=true
    username: sa
    password: 你的SQL Server密码
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  application:
    name: campus-trade-hub
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB

server:
  port: 8080

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted

app:
  upload:
    avatar-dir: uploads/avatars
