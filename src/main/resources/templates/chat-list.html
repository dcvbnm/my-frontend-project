<!DOCTYPE html>
<html lang="zh-CN">
<head>

</head>
<body>
<div class="chat-list-shell">

            <span class="brand-dot"></span>
            <div>
                <strong>Campus Trade Hub</strong>
                <span>会话列表</span>

            <a class="btn ghost" href="/browse">商品浏览</a>
            <a class="btn" href="/browse">去商品页发起聊天</a>
        </div>

        <span id="chatCount" class="count-pill">0 个会话</span>
