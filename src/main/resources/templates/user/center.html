<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户中心 - 校内二手交易平台</title>
    <link rel="stylesheet" href="/css/user/user-center.css">
</head>
<body class="user-page user-page-center">
<div class="bg-layer"></div>
<main class="card center-card">
    <header class="header-row">
        <div>
            <h1>用户中心</h1>
            <p class="sub" th:text="'欢迎你，' + ${user.username} + '（学号：' + ${user.studentId} + '）'">欢迎你</p>
        </div>
        <form method="post" action="/user/logout">
            <button type="submit" class="btn ghost">退出登录</button>
        </form>
    </header>

    <div class="msg success" th:if="${success}" th:text="${success}"></div>
    <div class="msg error" th:if="${error}" th:text="${error}"></div>
    <div class="center-layout">
        <aside class="side-nav" id="sideNav">
            <button class="nav-item is-active" type="button" data-target="pane-avatar">头像与身份</button>
            <button class="nav-item" type="button" data-target="pane-profile">个人资料</button>
            <button class="nav-item" type="button" data-target="pane-security">安全设置</button>
            <button class="nav-item" type="button" data-target="pane-address">收货地址</button>
            <button class="nav-item" type="button" data-target="pane-published">我发布的商品</button>
            <button class="nav-item" type="button" data-target="pane-favorite">我的收藏</button>
            <button class="nav-item" type="button" data-target="pane-notice">消息通知</button>
        </aside>

        <div class="content-stage">
            <section class="panel tab-pane is-active" id="pane-avatar">
                <h2>头像与身份展示</h2>
                <div class="avatar-grid">
                    <div class="avatar-preview-wrap">
                        <img class="avatar-preview" th:src="${user.avatarUrl}" alt="用户头像">
                        <p class="meta">学号：<span th:text="${user.studentId}"></span></p>
                    </div>
                    <form method="post" action="/user/center/avatar" enctype="multipart/form-data" class="form-grid">
                        <label>上传新头像（jpg/png/webp，2MB以内）</label>
                        <input type="file" name="avatar" accept=".jpg,.jpeg,.png,.webp" required>
                        <button type="submit" class="btn primary">上传头像</button>
                    </form>
                </div>
            </section>

            <section class="panel tab-pane" id="pane-profile">
                <h2>个人资料</h2>
                <form method="post" action="/user/center/profile" class="form-grid">
                    <label>昵称</label>
                    <input type="text" name="username" th:value="${user.username}" required>

                    <label>手机号</label>
                    <input type="text" name="phone" th:value="${user.phone}">

                    <label>邮箱</label>
                    <input type="email" name="email" th:value="${user.email}">

                    <label>个人简介</label>
                    <textarea name="bio" rows="3" th:text="${user.bio}"></textarea>

                    <button type="submit" class="btn primary">保存资料</button>
                </form>
            </section>

            <section class="panel tab-pane" id="pane-security">
                <h2>安全设置</h2>
                <form method="post" action="/user/center/password" class="form-grid">
                    <label>旧密码</label>
                    <input type="password" name="oldPassword" required>

                    <label>新密码</label>
                    <input type="password" name="newPassword" placeholder="至少 6 位" required>

                    <button type="submit" class="btn warn">修改密码</button>
                </form>
            </section>

            <section class="panel tab-pane" id="pane-address">
                <h2>收货地址</h2>
                <div class="list-grid" th:if="${#lists.isEmpty(user.addresses)}">暂无地址，请先添加。</div>
                <div class="address-list" th:if="${!#lists.isEmpty(user.addresses)}">
                    <article class="address-item" th:each="addr : ${user.addresses}">
                        <div>
                            <strong th:text="${addr.receiverName}"></strong>
                            <span th:if="${addr.defaultAddress}" class="tag">默认</span>
                            <p class="sub" th:text="${addr.receiverPhone} + ' · ' + ${addr.campus}"></p>
                            <p th:text="${addr.detail}"></p>
                        </div>
                        <div class="inline-actions">
                            <form method="post" action="/user/center/address/default" th:if="${!addr.defaultAddress}">
                                <input type="hidden" name="addressId" th:value="${addr.id}">
                                <button type="submit" class="btn ghost">设为默认</button>
                            </form>
                            <form method="post" action="/user/center/address/delete">
                                <input type="hidden" name="addressId" th:value="${addr.id}">
                                <button type="submit" class="btn danger">删除</button>
                            </form>
                        </div>
                    </article>
                </div>

                <form method="post" action="/user/center/address/add" class="form-grid split-grid">
                    <label>收货人</label>
                    <input type="text" name="receiverName" required>

                    <label>手机号</label>
                    <input type="text" name="receiverPhone" required>

                    <label>校区</label>
                    <input type="text" name="campus" placeholder="如：北校区" required>

                    <label>详细地址</label>
                    <input type="text" name="detail" placeholder="如：12栋 305" required>

                    <label class="checkbox-line">
                        <input type="checkbox" name="defaultAddress" value="true">
                        <span>设为默认地址</span>
                    </label>
                    <button type="submit" class="btn primary">新增地址</button>
                </form>
            </section>

            <section class="panel tab-pane" id="pane-published">
                <h2>我发布的商品</h2>
                <div class="list-grid" th:if="${#lists.isEmpty(user.publishedGoods)}">暂无发布记录</div>
                <article class="goods-item" th:each="item : ${user.publishedGoods}">
                    <div>
                        <strong th:text="${item.title}"></strong>
                        <p class="sub" th:text="${item.status}"></p>
                    </div>
                    <span class="price" th:text="${item.price}"></span>
                </article>
            </section>

            <section class="panel tab-pane" id="pane-favorite">
                <h2>我的收藏</h2>
                <div class="list-grid" th:if="${#lists.isEmpty(user.favoriteGoods)}">暂无收藏内容</div>
                <article class="goods-item" th:each="item : ${user.favoriteGoods}">
                    <div>
                        <strong th:text="${item.title}"></strong>
                        <p class="sub" th:text="${item.status}"></p>
                    </div>
                    <span class="price" th:text="${item.price}"></span>
                </article>
            </section>

            <section class="panel tab-pane" id="pane-notice">
                <h2>消息通知</h2>
                <div class="list-grid" th:if="${#lists.isEmpty(user.notifications)}">暂无系统消息</div>
                <article class="notice-item" th:each="n : ${user.notifications}">
                    <div>
                        <strong th:text="${n.title}"></strong>
                        <span class="tag muted" th:if="${n.read}">已读</span>
                        <span class="tag" th:if="${!n.read}">未读</span>
                        <p th:text="${n.content}"></p>
                        <p class="sub" th:text="${#temporals.format(n.createdAt, 'yyyy-MM-dd HH:mm')}"></p>
                    </div>
                    <form method="post" action="/user/center/notification/read" th:if="${!n.read}">
                        <input type="hidden" name="notificationId" th:value="${n.id}">
                        <button type="submit" class="btn ghost">标记已读</button>
                    </form>
                </article>
            </section>
        </div>
    </div>
</main>
<script>
    (function () {
        var nav = document.getElementById('sideNav');
        if (!nav) {
            return;
        }

        var buttons = Array.prototype.slice.call(nav.querySelectorAll('.nav-item'));
        var panes = Array.prototype.slice.call(document.querySelectorAll('.tab-pane'));

        function activate(targetId) {
            buttons.forEach(function (btn) {
                btn.classList.toggle('is-active', btn.getAttribute('data-target') === targetId);
            });
            panes.forEach(function (pane) {
                pane.classList.toggle('is-active', pane.id === targetId);
            });
        }

        buttons.forEach(function (btn) {
            btn.addEventListener('click', function () {
                activate(btn.getAttribute('data-target'));
            });
        });
    })();
</script>
</body>
</html>
