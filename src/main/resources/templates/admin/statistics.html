<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>统计报表</title>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; background: #f4f7f9; }
        .header { background: #1976d2; color: #fff; padding: 18px 24px; }
        .header a { color: #fff; margin-right: 18px; text-decoration: none; }
        .container { max-width: 1200px; margin: 28px auto; padding: 0 18px; }
        .card { background: #fff; border-radius: 12px; padding: 24px; box-shadow: 0 0 24px rgba(0,0,0,0.06); margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px; }
        .grid-item { background: #f8fbff; border: 1px solid #dce7f5; border-radius: 12px; padding: 20px; }
        .grid-item h2 { margin-top: 0; font-size: 24px; color: #1976d2; }
    </style>
</head>
<body>
<div class="header">
    <a th:href="@{/admin/dashboard}">首页</a>
    <a th:href="@{/admin/users}">用户管理</a>
    <a th:href="@{/admin/goods}">商品管理</a>
    <a th:href="@{/admin/orders}">订单管理</a>
    <a th:href="@{/admin/announcements}">公告管理</a>
    <a th:href="@{/admin/categories}">商品分类</a>
    <a th:href="@{/admin/statistics}">统计报表</a>
    <a th:href="@{/admin/logout}">退出登录</a>
</div>
<div class="container">
    <div class="card">
        <h1>统计报表</h1>
        <div class="grid">
            <div class="grid-item">
                <h2>活跃用户</h2>
                <p th:text="${activeUserCount}">0</p>
            </div>
            <div class="grid-item">
                <h2>商品总数</h2>
                <p th:text="${goodsCount}">0</p>
            </div>
            <div class="grid-item">
                <h2>订单总数</h2>
                <p th:text="${orderCount}">0</p>
            </div>
            <div class="grid-item">
                <h2>销售总额</h2>
                <p th:text="${totalSales}">0.00</p>
            </div>
        </div>
    </div>
        <div class="card">
            <h2>热门分类</h2>
            <table style="width:100%; border-collapse: collapse; margin-top: 16px;">
                <thead>
                <tr>
                    <th style="padding:12px; background:#f0f4fa; text-align:left;">分类</th>
                    <th style="padding:12px; background:#f0f4fa; text-align:left;">商品数量</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="category : ${topCategories}">
                    <td style="padding:12px; border-bottom:1px solid #e8ecf3;" th:text="${category.categoryName}"></td>
                    <td style="padding:12px; border-bottom:1px solid #e8ecf3;" th:text="${category.goodsCount}"></td>
                </tr>
                </tbody>
            </table>
        </div>
</div>
</body>
</html>
