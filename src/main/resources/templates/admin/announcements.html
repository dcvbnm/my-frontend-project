<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>公告管理</title>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; background: #f4f7f9; }
        .header { background: #1976d2; color: #fff; padding: 18px 24px; }
        .header a { color: #fff; margin-right: 18px; text-decoration: none; }
        .container { max-width: 1200px; margin: 28px auto; padding: 0 18px; }
        .card { background: #fff; border-radius: 12px; padding: 24px; box-shadow: 0 0 24px rgba(0,0,0,0.06); }
        table { width: 100%; border-collapse: collapse; margin-top: 16px; }
        th, td { padding: 14px 12px; border-bottom: 1px solid #e8ecf3; text-align: left; }
        th { background: #f0f4fa; }
        .button-group { display: flex; gap: 10px; margin-top: 16px; }
        .button-group a { display: inline-block; padding: 10px 16px; border-radius: 6px; background: #1976d2; color: #fff; text-decoration: none; }
    </style>
</head>
<body>
<div class="header">
    <button class="back-btn" onclick="history.back()" title="返回上一页" style="background: none; border: 1px solid #fff; border-radius: 4px; color: #fff; padding: 8px 12px; cursor: pointer; margin-right: 10px;">← 返回</button>
    <a th:href="@{/admin/dashboard}">首页</a>
    <a th:href="@{/admin/users}">用户管理</a>
    <a th:href="@{/admin/goods}">商品管理</a>
    <a th:href="@{/admin/orders}">订单管理</a>
    <a th:href="@{/admin/announcements}">公告管理</a>
    <a th:href="@{/admin/statistics}">统计报表</a>
    <a th:href="@{/admin/logout}">退出登录</a>
</div>
<div class="container">
    <div class="card">
        <h1>公告管理</h1>
        <form th:action="@{/admin/announcements/add}" method="post" style="margin-bottom: 20px; display:flex; gap: 10px; flex-wrap: wrap;">
            <input type="text" name="title" placeholder="标题" required style="flex: 1; padding: 10px; border: 1px solid #d1d9e6; border-radius: 6px;">
            <input type="text" name="content" placeholder="内容" required style="flex: 2; padding: 10px; border: 1px solid #d1d9e6; border-radius: 6px;">
            <button type="submit" style="background:#1976d2; color:#fff; border:none; border-radius:6px; padding:10px 16px; cursor:pointer;">发布公告</button>
        </form>
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>标题</th>
                <th>内容</th>
                <th>创建时间</th>
                <th>操作</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="announcement : ${announcements}">
                <td th:text="${announcement.announcementId}"></td>
                <td th:text="${announcement.title}"></td>
                <td th:text="${announcement.content}"></td>
                <td th:text="${#dates.format(announcement.createdAt, 'yyyy-MM-dd HH:mm:ss')}"></td>
                <td>
                    <form th:action="@{/admin/announcements/delete}" method="post" style="display:inline">
                        <input type="hidden" name="id" th:value="${announcement.announcementId}">
                        <button style="background:#d32f2f; color:#fff; border:none; border-radius:6px; padding:8px 12px; cursor:pointer;">删除</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
