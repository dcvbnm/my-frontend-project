<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>商品分类管理</title>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; background: #f4f7f9; }
        .header { background: #1976d2; color: #fff; padding: 18px 24px; }
        .header a { color: #fff; margin-right: 18px; text-decoration: none; }
        .container { max-width: 1200px; margin: 28px auto; padding: 0 18px; }
        .card { background: #fff; border-radius: 12px; padding: 24px; box-shadow: 0 0 24px rgba(0,0,0,0.06); }
        table { width: 100%; border-collapse: collapse; margin-top: 16px; }
        th, td { padding: 14px 12px; border-bottom: 1px solid #e8ecf3; text-align: left; }
        th { background: #f0f4fa; }
        form { display: flex; gap: 10px; align-items: center; margin-top: 16px; }
        input[type=text] { flex: 1; padding: 10px 12px; border: 1px solid #d1d9e6; border-radius: 6px; }
        button { padding: 10px 16px; border: none; border-radius: 6px; color: #fff; background: #1976d2; cursor: pointer; }
    </style>
</head>
<body>
<div class="header">
    <a th:href="@{/admin/dashboard}">首页</a>
    <a th:href="@{/admin/users}">用户管理</a>
    <a th:href="@{/admin/goods}">商品管理</a>
    <a th:href="@{/admin/orders}">订单管理</a>
    <a th:href="@{/admin/announcements}">公告管理</a>
    <a th:href="@{/admin/categories}">商品分类</a>
    <a th:href="@{/admin/statistics}">统计报表</a>
    <a th:href="@{/admin/logout}">退出登录</a>
</div>
<div class="container">
    <div class="card">
        <h1>商品分类管理</h1>
        <form th:action="@{/admin/categories/add}" method="post">
            <input type="text" name="name" placeholder="输入分类名称" required>
            <input type="text" name="description" placeholder="分类描述（可选）">
            <button type="submit">添加分类</button>
        </form>
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>分类名称</th>
                <th>描述</th>
                <th>操作</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="category : ${categories}">
                <td th:text="${category.categoryId}"></td>
                <td th:text="${category.categoryName}"></td>
                <td th:text="${category.description}"></td>
                <td>
                    <form th:action="@{/admin/categories/delete}" method="post" style="display:inline">
                        <input type="hidden" name="id" th:value="${category.categoryId}">
                        <button style="background:#d32f2f; color:#fff; border:none; border-radius:6px; padding:8px 12px; cursor:pointer;">删除</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
