<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校园二手平台 - 登录</title>
    <link rel="stylesheet" href="/css/login.css?v=20260421">
</head>
<body>
<div class="login-shell">
    <div class="login-card">
        <h1>校园二手平台</h1>
        <p>请先登录后再进入商品管理页面</p>

        <form id="loginForm" class="login-form">
            <label for="account">账号</label>
            <input id="account" type="text" maxlength="50" placeholder="用户名或用户ID" required>

            <label for="password">密码</label>
            <input id="password" type="password" value="123456" required>

            <button type="submit">登录</button>
            <div id="errorText" class="error-text"></div>
        </form>

        <div class="hint">默认密码为 123456</div>
    </div>
</div>
<script src="/js/login.js?v=20260421"></script>
</body>
</html>
